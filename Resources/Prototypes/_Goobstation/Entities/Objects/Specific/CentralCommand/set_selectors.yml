# ERT

- type: entity
  id: ERTSecurityUndeterminedWeapon
  name: emergency response weaponry pack
  description: A small remote utilizing bluespace technology to drop in a loadout directly to you. Choose wisely.
  parent: [ BaseItem, BaseSetSelector, BaseCentcommContraband ]
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Security/ertundetermined.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - ERTPulseSet
    maxSelectedSets: 1

# Nightshade Start - BSO hardsuit selector case
- type: entity
  id: BlueshieldUndeterminedHardsuit
  name: blueshield hardsuit pack
  description: A small box utilizing bluespace technology to drop in a loadout directly to you. Choose wisely.
  parent: [ BaseItem, BaseSetSelector, BaseCentcommContraband ]
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Security/blueshieldundetermined.rsi
    state: icon-alt
  - type: SetSelector
    possibleSets:
    - BSOHardsuitLightSet
    - BSOModsuitSet
    maxSelectedSets: 1

# ERT
# Nightshade End
