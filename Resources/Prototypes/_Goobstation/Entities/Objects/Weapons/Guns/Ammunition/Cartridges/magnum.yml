- type: entity
  id: CartridgeMagnumNeurotoxin
  name: shell (.45 subsonic neurotoxin)
  parent: BaseCartridgeMagnum
  components:
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#00FF00"
  - type: CartridgeAmmo
    proto: BulletMagnumNeurotoxin
  - type: ChemicalAmmo
  - type: Solution
    id: ammo
    solution:
      reagents:
      - ReagentId: Amatoxin
        Quantity: 9
      - ReagentId: Impedrezene
        Quantity: 5
  - type: SolutionTransfer
    maxTransferAmount: 9

# Nightshade Start - BSO Chester set
- type: entity # Omu start, uncomment this all.
  id: CartridgeMagnumEnsnaring
  name: cartridge (.45 magnum ensnaring)
  parent: BaseCartridgeMagnum
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumEnsnaring
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#cfff77"
- type: entity
  id: CartridgeMagnumFlash
  name: cartridge (.45 magnum flash)
  parent: BaseCartridgeMagnum
  components:
  - type: CartridgeAmmo
    proto: BulletMagnumFlash
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#fff94d" # Omu end.
# Nightshade End
