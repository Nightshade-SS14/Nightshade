- type: entity
  save: false
  name: Urist McHydra
  parent:
  - AppearanceHydrakin
  - BaseSpeciesMobOrganic
  id: BaseMobHydrakin
  abstract: true
  components:
  - type: Icon
    sprite: _Obelisk/Mobs/Species/Hydrakin/parts.rsi
    state: full
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: Satiation
    satiations:
      Hunger:
        prototype: NormalSatiationHunger
      Thirst:
        prototype: NormalSatiationThirst
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Hydrakin
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatChicken
      amount: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 200
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Temperature
  - type: TemperatureDamage
    coldDamageThreshold: 10 # Mono - Absurd cold resistance
    heatDamageThreshold: 332 # no. just no. suffer.
    coldDamage:
      types:
        Cold : 0.01 #per second, scales with temperature & other constants
  - type: TemperatureSpeed
    thresholds:
      90: 0.9
      40: 0.75
      10: 0.6
  - type: ThermalRegulator #Todo, implement hydrakin thermal movement generation
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250
    sweatHeatRegulation: 350
    shiveringHeatRegulation: 800
    normalBodyTemperature: 210.15
    thermalRegulationTemperatureThreshold: 30
    processWhileDead: false
    processWhileCrit: false
  - type: PassiveHeatGeneration
    watts: 3900
    mobStateModifier:
      Alive: 1
      Critical: 0.75
      Dead: 0
    minimumTemperature: 27.15 # too bad bro
    maximumTemperature: 340
    ignoreHeatResistance: true
  - type: PressureProtection
    lowPressureMultiplier: 1.2
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Hydraspeak
    understands:
    - TauCetiBasic
    - Hydraspeak
  - type: Carriable # Frontier: Carrying system from nyanotrasen.
  - type: Speech
    speechSounds: Hydrakin
    speechVerb: Reptilian
    allowedEmotes: ['Trill', 'Wurble',]
  - type: Vocal
    emoteSounds: UnisexHydrakin
  - type: TypingIndicator
    proto: robot
  - type: Hydrakin
